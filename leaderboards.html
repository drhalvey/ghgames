<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboards · GH Games</title>
<meta name="description" content="Daily, weekly, monthly and all-time leaderboards for every GH Games game.">
<meta name="theme-color" content="#0e1017">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<script src="analytics.js" defer></script>
<script src="theme.js"></script>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="index.html" aria-label="GH Games home">
      <img src="favicon.svg" alt="" width="34" height="34">
      <span>GH GAMES</span>
    </a>
    <nav>
      <a href="index.html#games">Games</a>
      <a href="leaderboards.html" class="on">Leaderboards</a>
    </nav>
  </div>
</header>

<main class="page">
  <div class="page-head">
    <h1>Leaderboards</h1>
    <p>Set your nickname once and it follows you into every game. Boards reset daily, weekly and monthly, with an all-time board that never resets.</p>
  </div>

  <div id="nick"></div>

  <div class="boards">
    <div id="lb-steal"></div>
    <div id="lb-sizesim"></div>
    <div id="lb-crazydads"></div>
    <div id="lb-bgs"></div>
    <div id="lb-wallhop"></div>
    <div id="lb-frondi"></div>
    <div id="lb-sprig"></div>
    <div id="lb-obby"></div>
    <div id="lb-sparrow"></div>
    <div id="lb-blackhole"></div>
    <div id="lb-log"></div>
    <div id="lb-frenzy"></div>
  </div>
</main>

<footer class="foot">
  <div class="foot-in">
    <span class="brand small"><img src="favicon.svg" alt="" width="22" height="22"><span>GH GAMES</span></span>
    <span>Nicknames only. Keep them friendly.</span>
  </div>
</footer>

<script src="leaderboard.js"></script>
<script>
  if (window.Leaderboard) {
    Leaderboard.mountNick('nick');
    Leaderboard.mount({ el:'lb-frenzy', game:'click-frenzy', dir:'desc', unit:'clicks', showNick:false, title:'Click Frenzy' });
    Leaderboard.mount({ el:'lb-obby',   game:'obby',         dir:'asc',  unit:'sec',    showNick:false, title:'Mega Obby — fastest time' });
    Leaderboard.mount({ el:'lb-blackhole', game:'blackhole', dir:'desc', unit:'orbits', showNick:false, title:'Black Hole — orbits in 60s' });
    Leaderboard.mount({ el:'lb-sparrow', game:'sparrow',     dir:'desc', unit:'pts',    showNick:false, title:'Sparrow Flyer — best score' });
    Leaderboard.mount({ el:'lb-log',    game:'log-clicker',  dir:'desc', unit:'wood',   showNick:false, title:'Log Clicker — all-time wood' });
    Leaderboard.mount({ el:'lb-frondi', game:'frondi-clicker', dir:'desc', unit:'Frondis', showNick:false, title:'Frondi Clicker — Frondis earned' });
    Leaderboard.mount({ el:'lb-wallhop', game:'wall-hop', dir:'desc', unit:'walls', showNick:false, title:'Wall Hop Pets — best wall reached' });
    Leaderboard.mount({ el:'lb-sprig', game:'sprig-rescue', dir:'desc', unit:'pts', showNick:false, title:'Sprig Rescue — total score' });
    Leaderboard.mount({ el:'lb-crazydads', game:'crazy-dads', dir:'desc', unit:'pts', showNick:false, title:'Crazy Dads — best round' });
    Leaderboard.mount({ el:'lb-sizesim', game:'size-simulator', dir:'desc', unit:'size', showNick:false, title:'Size Simulator — biggest size' });
    Leaderboard.mount({ el:'lb-steal', game:'steal-an-animal', dir:'desc', unit:'/s', showNick:false, title:'Steal an Animal — money per second' });
    Leaderboard.mount({ el:'lb-bgs', game:'bro-got-slammed', dir:'desc', unit:'KOs', showNick:false, title:'Bro Got Slammed — most knockouts in a round' });
  }
</script>
</body>
</html>
