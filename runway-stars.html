<style>
:root{
  color-scheme: dark;
  --bg:#1d1430; --panel:#2a1f45; --panel2:#3a2c5e; --line:#55447f;
  --ink:#fbf6ff; --muted:#c7b9e6; --gold:#ffc93c; --pink:#ff6fa3; --teal:#2fc1ae; --green:#4fcf6a; --red:#ff5d5d;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
button,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button,.doll,.item{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{background:var(--bg);margin:0}
body{font-family:var(--body);color:var(--ink);padding:14px 14px 40px;font-size:15px;
  background:radial-gradient(1200px 500px at 50% -120px,#4a2a78 0%,var(--bg) 70%) no-repeat,var(--bg)}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.home{font-weight:900;color:var(--muted);text-decoration:none;font-size:14px}
.home:hover{color:var(--gold)}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(32px,6vw,50px);margin:0;line-height:1;color:var(--pink);text-shadow:0 3px 0 #8e2a5a,0 6px 0 rgba(0,0,0,.25)}
h1 span{color:var(--gold);text-shadow:0 3px 0 #a86b10,0 6px 0 rgba(0,0,0,.25)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:7px 13px;font-weight:900;font-size:14px;color:var(--ink);font-family:var(--body)}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--gold)}
.msg{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:800;min-height:44px}
.msg.good{border-color:var(--green)} .msg.bad{border-color:var(--red)}
.card{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:14px}
.btn{font-family:var(--display);font-size:22px;border:0;border-radius:16px;padding:12px 26px;background:var(--pink);color:#fff;cursor:pointer;box-shadow:0 5px 0 #a3305f;letter-spacing:.5px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a3305f}
.btn.gold{background:var(--gold);color:#3a2400;box-shadow:0 5px 0 #a86b10}
.btn.teal{background:var(--teal);box-shadow:0 5px 0 #17786c}
.btn.ghost{background:var(--panel2);box-shadow:0 5px 0 #1a1230}
.btn:disabled{opacity:.5;cursor:default}
.small{font-family:var(--body);font-weight:900;font-size:15px;border:0;border-radius:12px;padding:9px 16px;background:var(--pink);color:#fff;cursor:pointer}
.small.alt{background:var(--panel2)}

/* dressing room */
.room{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:14px;align-items:start}
@media (max-width:700px){.room{grid-template-columns:1fr}}
.mirror{background:linear-gradient(#3b2a66,#24183f);border:2px solid var(--line);border-radius:20px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;position:sticky;top:10px}
@media (max-width:700px){.mirror{position:static}}
.mirror .doll{width:100%;max-width:240px;aspect-ratio:200/374}
.mirror .score{font-weight:900;color:var(--muted);font-size:13px;text-align:center}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tab{font-family:var(--body);font-weight:900;font-size:14px;border:2px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:12px;padding:7px 11px;cursor:pointer}
.tab.on{background:var(--pink);border-color:var(--pink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.item{position:relative;background:var(--panel2);border:3px solid var(--line);border-radius:14px;padding:6px 4px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--body);color:var(--ink)}
.item svg{width:84px;height:84px;background:rgba(0,0,0,.18);border-radius:10px}
.item .nm{font-weight:900;font-size:12.5px;text-align:center;line-height:1.1}
.item .rar{font-weight:900;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px}
.item.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.item.locked svg{filter:grayscale(.7) brightness(.6)}
.item .lock{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.72);border-radius:999px;padding:3px 8px;font-weight:900;font-size:12px;white-space:nowrap}
.r0{color:#c9c9d6}.r1{color:#6be38a}.r2{color:#62b6ff}.r3{color:#c48bff}.r4{color:#ffc93c}
.colours{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;align-items:center}
.colours .lbl{font-weight:900;color:var(--muted);font-size:13px;margin-right:4px}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid rgba(255,255,255,.25);cursor:pointer;position:relative;padding:0}
.sw.on{border-color:#fff;box-shadow:0 0 0 3px var(--pink)}
.sw .c{position:absolute;bottom:-6px;right:-8px;background:#000c;border-radius:999px;font-size:10px;font-weight:900;padding:1px 5px;color:#fff;white-space:nowrap}
.sw.locked{opacity:.7}

/* show */
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(90deg,#ff6fa3,#b06cff);border-radius:18px;padding:10px 16px;color:#fff}
.banner .th{font-family:var(--display);font-size:clamp(22px,4vw,32px);line-height:1.05}
.banner .sub{font-weight:900;font-size:13px;opacity:.95}
.banner .time{font-family:var(--display);font-size:30px;background:rgba(0,0,0,.25);border-radius:12px;padding:4px 12px;min-width:84px;text-align:center}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);width:100%;transition:width .25s linear}
.others{display:flex;flex-wrap:wrap;gap:6px}
.pchip{background:var(--panel2);border:2px solid var(--line);border-radius:999px;padding:5px 10px;font-weight:900;font-size:13px}
.pchip.ready{border-color:var(--green)}
.pchip.me{border-color:var(--gold)}

.stage{position:relative;border-radius:22px;overflow:hidden;border:2px solid var(--line);min-height:600px;padding-top:96px!important;
  background:
    radial-gradient(240px 360px at 20% -40px,rgba(255,240,180,.35),transparent 70%),
    radial-gradient(240px 360px at 80% -40px,rgba(255,240,180,.35),transparent 70%),
    linear-gradient(#2a1748 0%,#1a0f30 62%,#140a24 62%);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:16px}
.runway{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:62%;height:40%;
  background:linear-gradient(#e2d4ff,#ff9cc7);clip-path:polygon(30% 0,70% 0,100% 100%,0 100%);opacity:.9}
.crowd{position:absolute;bottom:0;left:0;right:0;height:16%;display:flex;justify-content:space-around;align-items:flex-end;pointer-events:none}
.crowd i{width:44px;height:44px;border-radius:50% 50% 0 0;background:#0d0719}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.6}100%{opacity:0}}
.model{position:relative;z-index:2;width:min(210px,46vw);aspect-ratio:200/374;margin-bottom:8px}
.model.walk{animation:walkin 1.1s ease-out both}
.model .doll{width:100%;height:100%;animation:bob 1s ease-in-out infinite}
@keyframes walkin{0%{transform:translateY(-70px) scale(.55);opacity:0}100%{transform:none;opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-6px) rotate(1deg)}}
.who{position:absolute;top:14px;left:0;right:0;text-align:center;z-index:3}
.who .n{font-family:var(--display);font-size:clamp(26px,5vw,38px);color:var(--gold);text-shadow:0 3px 0 #000a}
.who .k{font-weight:900;color:var(--muted);font-size:14px}
.rate{position:relative;z-index:3;background:rgba(20,10,36,.82);border:2px solid var(--line);border-radius:18px;padding:10px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:4px}
.rate .q{font-weight:900}
.stars{display:flex;gap:6px}
.star{font-size:40px;line-height:1;background:none;border:0;cursor:pointer;color:#5b4a85;padding:0 2px;transition:transform .1s}
.star.on{color:var(--gold);text-shadow:0 0 12px rgba(255,201,60,.7)}
.star:active{transform:scale(1.25)}

.results{display:flex;flex-direction:column;gap:12px}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:10px;flex-wrap:wrap}
.pod{display:flex;flex-direction:column;align-items:center;gap:4px;width:min(190px,30vw)}
.pod .doll{width:100%;aspect-ratio:200/374}
.pod .blk{width:100%;border-radius:12px 12px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;padding:6px}
.pod.p1 .blk{background:var(--gold);color:#3a2400;height:90px;font-size:18px}
.pod.p2 .blk{background:#c9d2e3;color:#1b2333;height:66px}
.pod.p3 .blk{background:#d88b4c;color:#2a1400;height:50px}
.table{display:flex;flex-direction:column;gap:6px}
.trow{display:flex;justify-content:space-between;align-items:center;background:var(--panel2);border-radius:12px;padding:8px 12px;font-weight:900}
.trow.me{outline:2px solid var(--gold)}
.trow .s{color:var(--gold)}
.hint{color:var(--muted);font-weight:700;font-size:13px}
.lobbyBtns{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.overlay{position:fixed;inset:0;background:rgba(10,5,20,.7);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay[hidden]{display:none}
.box{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:18px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:10px}
.box h3{margin:0;font-family:var(--display);font-weight:400;font-size:26px;color:var(--gold)}
.box input{font-family:var(--body);font-weight:900;font-size:18px;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);color:var(--ink)}
.box .row{display:flex;gap:8px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
#lb{margin-top:4px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff2a8"/><stop offset=".45" stop-color="#ffc93c"/><stop offset="1" stop-color="#c98a10"/></linearGradient>
    <linearGradient id="gRainbow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4d6d"/><stop offset=".2" stop-color="#ff9f1c"/><stop offset=".4" stop-color="#ffe14d"/><stop offset=".6" stop-color="#4fcf6a"/><stop offset=".8" stop-color="#3d8bff"/><stop offset="1" stop-color="#9b5de5"/></linearGradient>
    <linearGradient id="gGalaxy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1464"/><stop offset=".5" stop-color="#6a1b9a"/><stop offset="1" stop-color="#ff4fa3"/></linearGradient>
    <radialGradient id="gAura"><stop offset="0" stop-color="#fff3b0" stop-opacity=".95"/><stop offset=".6" stop-color="#ffc93c" stop-opacity=".45"/><stop offset="1" stop-color="#ffc93c" stop-opacity="0"/></radialGradient>
    <linearGradient id="gGlass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8f6ff" stop-opacity=".3"/><stop offset="1" stop-color="#9fd3ff" stop-opacity=".15"/></linearGradient>

<div class="wrap">
  <a class="home" href="index.html">&larr; All games</a>
  <div class="top">
    <h1>Runway <span>Stars</span></h1>
    <div class="chips">
      <button class="chip" id="nameChip" type="button">👤 Player</button>

  <!-- the show -->
  <div id="show" hidden>

    <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">

  <div class="card"><div id="lb"></div></div>
</div>

<div class="overlay" id="overlay" hidden><div class="box" id="box"></div></div>
<div class="confetti" id="confetti"></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---------------- save ----------------
const SAVE_KEY = "runwaystars-save";
const DEFAULT_FIT = { sk: 1, hr: "short", hrC: "brown", ht: "none", htC: "red", tp: "tshirt", tpC: "blue", bt: "jeans", btC: "blue", sh: "sneakers", shC: "white", ex: "none", exC: "red", fc: "none", fcC: "pink", nk: "none", nkC: "red", hd: "none", hdC: "pink" };
let S = { wins: 0, total: 0, best: 0, owned: [], fit: Object.assign({}, DEFAULT_FIT) };
try { const raw = localStorage.getItem(SAVE_KEY); if (raw) { const o = JSON.parse(raw); S = Object.assign(S, o); S.fit = Object.assign({}, DEFAULT_FIT, o.fit || {}); } } catch (e) {}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

// ---------------- names (shared with the other GH Games) ----------------
const NAME_KEY = "ghgames_nick";
const BAD = ["fuck","shit","bitch","cunt","dick","cock","pussy","asshole","arsehole","wanker","twat","bastard","slut","whore","nigg","fag","retard","penis","vagina","boob","tits","porn","sex","damn","crap","piss","bollock","prick","knob","bugger","bloody","hell","kys","rape","nazi","hitler","dildo","cum"];
function isRude(v) { const t = (v || "").toLowerCase().replace(/[013457@$!]/g, c => ({"0":"o","1":"i","3":"e","4":"a","5":"s","7":"t","@":"a","$":"s","!":"i"}[c])).replace(/[^a-z]/g, ""); return BAD.some(w => t.includes(w)); }
function cleanName(v) { return (v || "").replace(/[^A-Za-z0-9 _\-!?.']/g, "").replace(/\s+/g, " ").trim().slice(0, 12); }
function safeName(v) { const n = cleanName(v); return !n || isRude(n) ? "Player" : n; }
let NAME = "Player";
try { NAME = safeName(localStorage.getItem(NAME_KEY)); } catch (e) {}
const hasName = () => NAME && NAME !== "Player";

// ---------------- fashion data ----------------
const RAR = ["Basic", "Cool", "Fancy", "Epic", "Legendary"];
const COST = [0, 2, 5, 12, 25];
const SKINS = ["#ffe0c4", "#f5c29a", "#e0a477", "#b97a50", "#8a5636", "#5e3a22"];
const COLOURS = [
  { id: "red", c: "#e8384f" }, { id: "orange", c: "#ff8a3d" }, { id: "yellow", c: "#ffd23f" }, { id: "green", c: "#4fcf6a" },
  { id: "teal", c: "#2fc1ae" }, { id: "blue", c: "#2f6fde" }, { id: "purple", c: "#8e5bd6" }, { id: "pink", c: "#ff6fa3" },
  { id: "white", c: "#f4f4f8" }, { id: "black", c: "#26262e" }, { id: "brown", c: "#7a4a2a" }, { id: "grey", c: "#8a93a6" },
  { id: "neon", c: "#39ff14", cost: 3, nm: "Neon" }, { id: "gold", c: "url(#gGold)", cost: 8, nm: "Gold" },
  { id: "rainbow", c: "url(#gRainbow)", cost: 15, nm: "Rainbow" }, { id: "galaxy", c: "url(#gGalaxy)", cost: 25, nm: "Galaxy" }
];
const COL = Object.fromEntries(COLOURS.map(c => [c.id, c]));
const PREMIUM = new Set(COLOURS.filter(c => c.cost).map(c => c.id));
const col = id => (COL[id] || COL.red).c;

const THEMES = [
  { id: "beach", nm: "Beach Day", e: "🏖️" }, { id: "party", nm: "Party Night", e: "🎉" },
  { id: "hero", nm: "Superhero", e: "🦸" }, { id: "winter", nm: "Winter Snow", e: "❄️" },
  { id: "sport", nm: "Sports Star", e: "⚽" }, { id: "royal", nm: "Royal Ball", e: "👑" },
  { id: "spooky", nm: "Spooky Night", e: "🎃" }, { id: "space", nm: "Outer Space", e: "🚀" },
  { id: "any", nm: "Anything Goes", e: "✨" }
];
const THEME = Object.fromEntries(THEMES.map(t => [t.id, t]));

// slot key, colour key, tab label
const SLOTS = [
  { k: "hr", c: "hrC", tab: "💇 Hair", vb: "45 -10 110 110" },
  { k: "ht", c: "htC", tab: "🎩 Hats", vb: "35 -30 130 130" },
  { k: "tp", c: "tpC", tab: "👕 Tops", vb: "30 80 140 140" },
  { k: "bt", c: "btC", tab: "👖 Bottoms", vb: "30 175 140 140" },
  { k: "sh", c: "shC", tab: "👟 Shoes", vb: "55 250 90 90" },
  { k: "fc", c: "fcC", tab: "😎 Face", vb: "55 20 90 75" },
  { k: "nk", c: "nkC", tab: "📿 Necklaces", vb: "55 70 90 90" },
  { k: "hd", c: "hdC", tab: "🪄 Hold", vb: "80 70 130 170" },
  { k: "ex", c: "exC", tab: "✨ Extras", vb: "0 -30 200 370" }
];
// t = tier, th = themes it matches, fx = fixed colour (no colour choice)
const ITEMS = {
  hr: [
    { id: "short", nm: "Short", t: 0, th: ["sport"] },
    { id: "long", nm: "Long", t: 0, th: ["beach", "royal"] },
    { id: "pony", nm: "Ponytail", t: 0, th: ["sport", "beach"] },
    { id: "spiky", nm: "Spiky", t: 1, th: ["hero", "party"] },

const owns = (k, id) => { const it = ITEM[k][id]; return !!it && (it.t === 0 || S.owned.includes(k + ":" + id)); };
const ownsCol = id => !PREMIUM.has(id) || S.owned.includes("col:" + id);

// a fit from anywhere (another player, an old save) is cleaned before use
function norm(f) {
  f = f && typeof f === "object" ? f : {};
  const o = {};
  o.sk = Math.max(0, Math.min(SKINS.length - 1, Math.floor(Number(f.sk) || 0)));
  for (const s of SLOTS) {
    o[s.k] = ITEM[s.k][f[s.k]] ? f[s.k] : DEFAULT_FIT[s.k];
    o[s.c] = COL[f[s.c]] ? f[s.c] : DEFAULT_FIT[s.c];
  }
  return o;
}

function doll(f, vb) {
  f = norm(f);
  const skin = SKINS[f.sk], C = k => col(f[k]);
  let s = "";
  if (DRAW.exBack[f.ex]) s += DRAW.exBack[f.ex](C("exC"));
  if (DRAW.hairBack[f.hr]) s += DRAW.hairBack[f.hr](C("hrC"));
  // body
  s += `<rect x="80" y="190" width="18" height="118" rx="8" fill="${skin}" ${OL}/><rect x="102" y="190" width="18" height="118" rx="8" fill="${skin}" ${OL}/>`;
  s += `<rect x="52" y="100" width="16" height="88" rx="8" fill="${skin}" ${OL}/><rect x="132" y="100" width="16" height="88" rx="8" fill="${skin}" ${OL}/>`;
  s += `<circle cx="60" cy="192" r="9" fill="${skin}" ${OL}/><circle cx="140" cy="192" r="9" fill="${skin}" ${OL}/>`;
  s += `<rect x="70" y="96" width="60" height="100" rx="14" fill="${skin}" ${OL}/><rect x="92" y="80" width="16" height="22" fill="${skin}"/>`;
  s += DRAW.shoes[f.sh](C("shC"));
  if (f.tp === "robe") { s += DRAW.bottom[f.bt](C("btC")); s += DRAW.top.robe(C("tpC")); }
  else if (f.bt === "gown") { s += DRAW.top[f.tp](C("tpC")); s += DRAW.bottom.gown(C("btC")); }
  else { s += DRAW.bottom[f.bt](C("btC")); s += DRAW.top[f.tp](C("tpC")); }
  if (DRAW.neck[f.nk]) s += DRAW.neck[f.nk](C("nkC"));
  if (f.ex === "scarf" || f.ex === "backpack") s += DRAW.exFront[f.ex](C("exC"));
  // hands over sleeves, then whatever is held
  s += `<circle cx="60" cy="192" r="9" fill="${skin}" ${OL}/><circle cx="140" cy="192" r="9" fill="${skin}" ${OL}/>`;
  if (DRAW.hold[f.hd]) s += DRAW.hold[f.hd](C("hdC"));
  if (f.ex === "balloons" || f.ex === "puppy") s += DRAW.exFront[f.ex](C("exC"));
  // head
  s += `<circle cx="70" cy="60" r="6" fill="${skin}" ${OL}/><circle cx="130" cy="60" r="6" fill="${skin}" ${OL}/>`;
  s += `<circle cx="100" cy="56" r="30" fill="${skin}" ${OL}/>`;
  s += `<circle cx="89" cy="57" r="3.6" fill="#1b1b2b"/><circle cx="111" cy="57" r="3.6" fill="#1b1b2b"/><circle cx="90" cy="56" r="1.2" fill="#fff"/><circle cx="112" cy="56" r="1.2" fill="#fff"/>`;
  s += `<circle cx="82" cy="67" r="5" fill="#ff6fa3" opacity=".3"/><circle cx="118" cy="67" r="5" fill="#ff6fa3" opacity=".3"/>`;
  s += `<path d="M90 69 Q100 78 110 69" stroke="#7a2a2a" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  if (DRAW.hairFront[f.hr]) s += DRAW.hairFront[f.hr](C("hrC"));
  if (DRAW.face[f.fc]) s += DRAW.face[f.fc](C("fcC"));
  if (f.ex === "shades") s += DRAW.exFront.shades();
  if (DRAW.hat[f.ht]) s += DRAW.hat[f.ht](C("htC"));
  return `<svg class="doll" viewBox="${vb || "0 -34 200 374"}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${s}</svg>`;
}

// ---------------- how good an outfit looks to the computer judges ----------------
function quality(f, th) {
  f = norm(f);
  let tiers = 0, match = 0;
  for (const s of SLOTS) {
    const it = ITEM[s.k][f[s.k]];
    tiers += it.t;
    if (th !== "any" && it.th.includes(th)) match++;
  }
  let prem = 0;
  for (const s of SLOTS) { const it = ITEM[s.k][f[s.k]]; if (!it.fx && it.id !== "none" && PREMIUM.has(f[s.c])) prem++; }
  let q = 1.3 + (tiers / SLOTS.length) * 0.7 + Math.min(6, match) * 0.3 + Math.min(4, prem) * 0.18;
  if (th === "any") q += 0.5;
  // matching colours look put together
  const cs = [f.tpC, f.btC, f.shC].filter(c => c);
  if (new Set(cs).size === 1) q += 0.15;

  const order = [top[1], top[0], top[2]].filter(Boolean);
  const pod = order.map(p => { const place = list.indexOf(p) + 1; return `<div class="pod p${place}">${doll(p.f || DEFAULT_FIT)}<div class="blk"><div>${place === 1 ? "🥇" : place === 2 ? "🥈" : "🥉"} ${esc(p.n)}</div><div>⭐ ${p.a.toFixed(1)}</div></div></div>`; }).join("");
  const rows = list.map((p, i) => { const n = (V.sc[p.i] || [0, 0])[1]; return `<div class="trow ${p.i === MYID ? "me" : ""}"><span>${i + 1}. ${p.b ? "🤖" : "🧑"} ${esc(p.n)}${V.w.includes(p.i) ? " 🏆" : ""}</span><span><span class="s">${starTxt(p.a)}</span> ${p.a.toFixed(1)} <span class="hint">(${n} ${n === 1 ? "vote" : "votes"})</span></span></div>`; }).join("");
  $("resView").innerHTML = `<div class="podium">${pod}</div><div class="table">${rows}</div>`;
  const meRow = list.find(p => p.i === MYID);
  if (V.w.includes(MYID) && awarded !== V.h + ":" + V.r) {
    awarded = V.h + ":" + V.r; S.wins += 1; S.total += 1; if (window.PhatCoin) PhatCoin.earn("win", 5, "winning the show");
    if (meRow && meRow.a > S.best) S.best = meRow.a;
    save(); renderHUD(); confetti();
    setMsg(`🏆 You won the show with ${meRow.a.toFixed(1)} stars! +1 win. Spend it on better fashion.`, "good");
    if (window.Leaderboard && hasName()) Leaderboard.submit(S.total);
  } else if (meRow) {
    const place = list.indexOf(meRow) + 1;
    if (meRow.a > S.best) { S.best = meRow.a; save(); }
    setMsg(`You came ${place}${["st", "nd", "rd"][place - 1] || "th"} with ${meRow.a.toFixed(1)} stars. Match the theme and get better clothes to win!`);
  }
}
setInterval(() => {
  if (!playing || !V) return;
  const left = timeLeft(), total = V.p === "dress" ? DRESS_MS : V.p === "walk" ? WALK_MS : RES_MS;
  const s = Math.ceil(left / 1000);
  $("time").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  $("barFill").style.width = Math.max(0, Math.min(100, left / total * 100)) + "%";
}, 200);

// ---------------- buttons ----------------
$("playBtn").onclick = () => {
  playing = true; joinT = Date.now(); lastSt = null; awarded = ""; lastPhaseKey = ""; V = null; H = null; myRates = {};
  $("lobby").hidden = true; $("show").hidden = false;
  isHost = true; hostId = MYID; startRound();
  connect(); updateOnline();
};
$("leaveBtn").onclick = () => {
  playing = false; disconnect(); isHost = false; H = null; V = null;
  $("lobby").hidden = false; $("show").hidden = true;
  renderRoom($("roomLobby")); updateOnline();
  setMsg("You left the show. Change your outfit or buy new clothes, then press Play.");
};
$("readyBtn").onclick = () => {
  sendFit();
  if (isHost) { if (H && H.p === "dress") { H.ready.add(MYID); hostPush(); } }
  else bcast("rdy", { i: MYID });
  $("readyBtn").disabled = true;
};
$("nameChip").onclick = () => {
  $("box").innerHTML = `<h3>What's your name?</h3><input id="nameIn" maxlength="12" autocomplete="off" spellcheck="false" aria-label="Your name">
    <p class="hint" id="nameHint">First name or nickname only. Up to 12 letters. Everyone sees it on the runway and the leaderboard.</p>
    <div class="row"><button class="small" id="nameOk" type="button">Save</button><button class="small alt" id="nameCancel" type="button">Cancel</button></div>`;
  $("overlay").hidden = false; const inp = $("nameIn"); inp.value = hasName() ? NAME : ""; inp.focus();
  const done = () => {
    const v = cleanName(inp.value);
    if (isRude(v)) { inp.value = ""; $("nameHint").textContent = "That name is not allowed. Try another one."; inp.focus(); return; }
    NAME = v || "Player"; try { localStorage.setItem(NAME_KEY, NAME); } catch (e) {}
    if (online && ch) try { ch.track(meta()); } catch (e) {}
    if (isHost && H) { const e = H.ps.find(p => p.i === MYID); if (e) e.n = NAME; hostPush(); }
    renderHUD(); closeBox(); setMsg(`Hi ${NAME}! Your name is saved.`, "good");
  };
  $("nameOk").onclick = done; $("nameCancel").onclick = closeBox;
  inp.addEventListener("keydown", e => { if (e.key === "Enter") done(); if (e.key === "Escape") closeBox(); });
};
$("overlay").addEventListener("click", e => { if (e.target === $("overlay")) closeBox(); });
setInterval(() => { try { const n = safeName(localStorage.getItem(NAME_KEY)); if (n !== "Player" && n !== NAME) { NAME = n; renderHUD(); } } catch (e) {} }, 2000);
// an online save coming down from account.js replaces the save while the page is open
setInterval(() => { try { const raw = localStorage.getItem(SAVE_KEY); if (raw && raw !== JSON.stringify(S)) { const o = JSON.parse(raw); S = Object.assign(S, o); S.fit = Object.assign({}, DEFAULT_FIT, o.fit || {}); renderHUD(); if (!playing) renderRoom($("roomLobby")); } } catch (e) {} }, 3000);
document.addEventListener("visibilitychange", () => {
  if (!playing) return;
  if (document.hidden) { if (online) disconnect(); }
  else if (!online) { joinT = Date.now(); connect(); }
});

// ---------------- no zooming on iPhone / iPad ----------------
["gesturestart", "gesturechange", "gestureend"].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
let lastTouchEnd = 0;
document.addEventListener("touchend", e => {
  const now = Date.now();
  if (now - lastTouchEnd < 350 && !(e.target.closest && e.target.closest("input,button,a"))) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

// ---------------- start up ----------------
S.fit = norm(S.fit);
renderHUD(); renderRoom($("roomLobby")); updateOnline();
if (window.Leaderboard) Leaderboard.mount({ el: "lb", game: "runway-stars", dir: "desc", unit: "wins", max: 100000, title: "Runway Stars: most shows won" });
</script>
</body>
</html>
